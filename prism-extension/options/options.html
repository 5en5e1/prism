<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Refraction Console Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="settings-shell">
      <header class="page-hero">
        <p class="eyebrow">Local workspace</p>
        <h1>Options and cache</h1>
        <div class="settings-pyramid-scene" aria-hidden="true">
          <div class="pyramid-object">
            <span class="pyramid-shadow"></span>
            <div class="pyramid-core">
              <span class="pyramid-face pyramid-face-front"></span>
              <span class="pyramid-face pyramid-face-right"></span>
              <span class="pyramid-face pyramid-face-back"></span>
              <span class="pyramid-face pyramid-face-left"></span>
              <span class="pyramid-base"></span>
            </div>
          </div>
        </div>
      </header>

      <section class="panel cache-panel" aria-label="Cached webpages">
        <div class="panel-heading cache-heading">
          <div>
            <p class="eyebrow">Cached Pages</p>
            <h2>Saved webpage outputs</h2>
          </div>
          <div class="cache-actions">
            <p id="cacheState" class="save-state" aria-live="polite"></p>
            <button id="clearAllCache" class="danger-button" type="button">Clear everything</button>
          </div>
        </div>

        <div id="cacheList" class="cache-list"></div>
        <p id="cacheEmpty" class="empty-state" hidden>No cached webpages yet.</p>
      </section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
